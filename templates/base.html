<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}LaunchBlast{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(10, 19, 35, 0.84);
      --panel-strong: rgba(13, 25, 47, 0.96);
      --line: rgba(148, 163, 184, 0.18);
      --text: #eff5ff;
      --muted: #8ea3c1;
      --accent: #7df9c7;
      --accent-2: #f6c177;
      --accent-3: #85b7ff;
      --danger: #ff8097;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background:
        radial-gradient(circle at top left, rgba(125, 249, 199, 0.14), transparent 28%),
        radial-gradient(circle at top right, rgba(133, 183, 255, 0.14), transparent 24%),
        radial-gradient(circle at 50% 20%, rgba(246, 193, 119, 0.08), transparent 26%),
        linear-gradient(180deg, #08101d 0%, #040814 100%);
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, .display-font {
      font-family: "Space Grotesk", sans-serif;
      letter-spacing: -0.04em;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.07) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at center, black, transparent 78%);
      opacity: 0.34;
      z-index: -1;
    }

    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 48px;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 26px 90px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px);
    }

    .glass-strong {
      background: var(--panel-strong);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .chip {
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(148, 163, 184, 0.08);
    }

    .field {
      width: 100%;
      background: rgba(3, 7, 18, 0.56);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--text);
      border-radius: 18px;
      padding: 14px 16px;
      outline: none;
      font: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .field:focus {
      border-color: rgba(125, 249, 199, 0.72);
      box-shadow: 0 0 0 3px rgba(125, 249, 199, 0.14);
    }

    textarea.field {
      min-height: 170px;
      resize: vertical;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      appearance: none;
      border: 0;
      border-radius: 18px;
      padding: 14px 20px;
      font: inherit;
      font-weight: 700;
      color: #06111b;
      background: linear-gradient(135deg, #7df9c7 0%, #c7ff7d 100%);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
      box-shadow: 0 18px 34px rgba(125, 249, 199, 0.16);
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button.secondary {
      color: var(--text);
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: none;
    }

    .button.secondary:hover {
      background: rgba(148, 163, 184, 0.18);
    }

    .status-dot {
      width: 0.58rem;
      height: 0.58rem;
      border-radius: 999px;
      display: inline-block;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
    }

    .muted {
      color: var(--muted);
    }

    .stat {
      min-height: 112px;
    }

    .fade-up {
      animation: fadeUp 420ms ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
